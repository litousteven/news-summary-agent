# RSS 新闻源配置
# 修改此文件后无需重新编译，下次运行自动生效
# 字段说明:
#   name: 来源名称（显示用）
#   url: RSS 订阅地址
#   lang: 语言标识 zh/en
#   use_proxy: 是否需要代理访问
#   enabled: 是否启用（true/false），关闭后不会被抓取

# ===== 默认启用的核心源 =====

- name: 中新网
  url: https://www.chinanews.com.cn/rss/world.xml
  lang: zh
  use_proxy: false
  enabled: true

- name: BBC
  url: https://feeds.bbci.co.uk/news/world/rss.xml
  lang: en
  use_proxy: true
  enabled: true

- name: NPR
  url: https://feeds.npr.org/1004/rss.xml
  lang: en
  use_proxy: true
  enabled: true

- name: NYT
  url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
  lang: en
  use_proxy: true
  enabled: true

- name: 联合早报
  url: https://plink.anyfeeder.com/zaobao/realtime/world
  lang: zh
  use_proxy: false
  enabled: true

- name: 联合早报-中国
  url: https://plink.anyfeeder.com/zaobao/realtime/china
  lang: zh
  use_proxy: false
  enabled: true

