# 新闻简报 Agent 配置文件
# 修改此文件后无需重新编译，下次运行自动生效

# 每个RSS源最大抓取条目数
max_items_per_feed: 16

# 总共最大抓取条目数
max_total_items: 120

# 简报最大入选条目数
max_digest_items: 10

# 每个分类最大条目数
max_per_category: 5

# 语义去重相似度阈值 (0.0~1.0，越低越容易判为重复)
cluster_threshold: 0.75

# data/log 目录文件过期天数（超过此天数的 push_history/tagged_cache/embedding_cache/digest/log 文件将被清理）
file_expiry_days: 2

# 新闻时效窗口（天）：发布超过此天数的条目在抓取阶段直接丢弃。
# 停更的 RSS 源会一直返回最后一批旧闻，没有这道闸门它们会被反复标注、
# 反复推送。推送历史的去重窗口自动取该值 +1 天，保证「还够新、能被选中」
# 的条目同时也「还在历史里、能被去重拦住」。
max_news_age_days: 3

# 中间带去重核查：相似度落在 [dedup_verify_floor, cluster_threshold) 的条目
# 用一次 LLM 调用批量判断是否同一事件。同一场发布会的多篇稿件相似度常在
# 0.45–0.60，达不到 cluster_threshold，只靠向量会全部入选。
dedup_verify_floor: 0.40
dedup_verify_max_pairs: 30

# RSS 抓取重试：代理抖动/超时等瞬时失败时重试，避免整轮丢掉一个源。
# 线性退避 = 第 n 次重试等待 n * feed_retry_base_delay_seconds 秒。
# 4xx 视为永久失败（地址失效/被拒），不重试。
feed_max_retries: 2
feed_retry_base_delay_seconds: 3

# === 标注批次参数（一般无需调整，除非标注任务频繁失败） ===
# 每批次发送给 LLM 的新闻条数
tag_batch_size: 5
# 并行处理的批次数量上限
tag_max_concurrent_batches: 1
# 单个批次失败后最大重试次数
tag_max_retries: 3
# 重试指数退避的基础延迟（秒）
tag_retry_base_delay_seconds: 5
# 单个批次的超时时间（秒）
tag_batch_timeout_seconds: 300
